<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="t d">
  <title id="t">The working loop: frame, explore, specify, execute, verify</title>
  <desc id="d">Five stages with two distinct feedback loops: execution errors return to Execute, specification errors return to Specify.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1120" height="540" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="58" font-size="22" font-weight="800" fill="#0F172A">The working loop</text>
    <text x="56" y="84" font-size="13.5" fill="#64748B">Five stages. Two different kinds of failure. Do not confuse them.</text>

    <!-- stage 1 -->
    <g>
      <rect x="56" y="120" width="176" height="176" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="78" y="150" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#94A3B8">01</text>
      <text x="78" y="180" font-size="17" font-weight="700" fill="#0F172A">Frame</text>
      <text x="78" y="206" font-size="12.5" fill="#475569">What problem, what</text>
      <text x="78" y="224" font-size="12.5" fill="#475569">constraints, what</text>
      <text x="78" y="242" font-size="12.5" fill="#475569">proves it works.</text>
      <rect x="56" y="264" width="176" height="32" rx="0" fill="none"/>
      <text x="78" y="284" font-size="11" font-weight="600" fill="#64748B">→ acceptance check</text>
    </g>

    <!-- stage 2 -->
    <g>
      <rect x="264" y="120" width="176" height="176" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="286" y="150" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#94A3B8">02</text>
      <text x="286" y="180" font-size="17" font-weight="700" fill="#0F172A">Explore</text>
      <text x="286" y="206" font-size="12.5" fill="#475569">Read the code.</text>
      <text x="286" y="224" font-size="12.5" fill="#475569">Change nothing.</text>
      <text x="286" y="242" font-size="12.5" fill="#475569">Find the pattern.</text>
      <text x="286" y="284" font-size="11" font-weight="600" fill="#64748B">→ list of files</text>
    </g>

    <!-- stage 3 -->
    <g>
      <rect x="472" y="120" width="176" height="176" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
      <text x="494" y="150" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#6366F1">03</text>
      <text x="494" y="180" font-size="17" font-weight="700" fill="#0F172A">Specify</text>
      <text x="494" y="206" font-size="12.5" fill="#475569">Plan with file paths,</text>
      <text x="494" y="224" font-size="12.5" fill="#475569">interfaces, out of</text>
      <text x="494" y="242" font-size="12.5" fill="#475569">scope, test plan.</text>
      <text x="494" y="284" font-size="11" font-weight="600" fill="#4338CA">→ written plan</text>
    </g>

    <!-- stage 4 -->
    <g>
      <rect x="680" y="120" width="176" height="176" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
      <text x="702" y="150" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#0284C7">04</text>
      <text x="702" y="180" font-size="17" font-weight="700" fill="#0F172A">Execute</text>
      <text x="702" y="206" font-size="12.5" fill="#475569">One small batch.</text>
      <text x="702" y="224" font-size="12.5" fill="#475569">Run the check.</text>
      <text x="702" y="242" font-size="12.5" fill="#475569">Commit if green.</text>
      <text x="702" y="284" font-size="11" font-weight="600" fill="#0369A1">→ small diff</text>
    </g>

    <!-- stage 5 -->
    <g>
      <rect x="888" y="120" width="176" height="176" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
      <text x="910" y="150" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#059669">05</text>
      <text x="910" y="180" font-size="17" font-weight="700" fill="#0F172A">Verify</text>
      <text x="910" y="206" font-size="12.5" fill="#475569">Run the check in</text>
      <text x="910" y="224" font-size="12.5" fill="#475569">a fresh context.</text>
      <text x="910" y="242" font-size="12.5" fill="#475569">Demand evidence.</text>
      <text x="910" y="284" font-size="11" font-weight="600" fill="#047857">→ pass / fail + proof</text>
    </g>

    <!-- forward arrows -->
    <line x1="236" y1="208" x2="258" y2="208" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="444" y1="208" x2="466" y2="208" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="652" y1="208" x2="674" y2="208" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="860" y1="208" x2="882" y2="208" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

    <!-- gate -->
    <path d="M 664 84 L 678 96 L 664 108 L 650 96 Z" fill="#F59E0B"/>
    <text x="664" y="78" font-size="10.5" font-weight="700" text-anchor="middle" fill="#B45309">GATE</text>

    <!-- feedback a: execution error -->
    <path d="M 930 296 L 930 356 L 768 356 L 768 300" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#ai)"/>
    <rect x="796" y="343" width="120" height="24" rx="12" fill="#EEF2FF"/>
    <text x="856" y="359" font-size="10.5" font-weight="600" text-anchor="middle" fill="#4338CA">fix the code</text>

    <!-- feedback b: specification error -->
    <path d="M 1000 296 L 1000 420 L 560 420 L 560 300" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai)"/>
    <rect x="700" y="407" width="160" height="24" rx="12" fill="#EEF2FF"/>
    <text x="780" y="423" font-size="10.5" font-weight="600" text-anchor="middle" fill="#4338CA">fix the plan, not the code</text>

    <line x1="56" y1="466" x2="1064" y2="466" stroke="#E2E8F0" stroke-width="1"/>
    <text x="56" y="494" font-size="12.5" fill="#475569">Every stage leaves an artefact the next stage can check.</text>
    <text x="56" y="514" font-size="12.5" fill="#475569">If the agent fails twice in the same place, the defect is upstream — in the spec, not the model.</text>
  </g>
</svg>
