<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t">
  <title id="t">Agentic Engineering — a durable handbook</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g transform="translate(0,34)" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="108" font-size="14" font-weight="700" letter-spacing="3" fill="#4F46E5">OPEN HANDBOOK · FIRST EDITION</text>

    <text x="80" y="200" font-size="72" font-weight="800" fill="#0F172A">Agentic</text>
    <text x="80" y="272" font-size="72" font-weight="800" fill="#0F172A">Engineering</text>

    <text x="80" y="330" font-size="22" fill="#475569">A durable handbook for directing coding agents</text>
    <text x="80" y="362" font-size="22" fill="#475569">— and staying the engineer.</text>

    <line x1="80" y1="404" x2="188" y2="404" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="444" font-size="16" fill="#64748B">14 principles · 9 chapters · 22 verified sources</text>
    <text x="80" y="470" font-size="16" fill="#64748B">6 diagrams · a 14-day plan that needs no keyboard</text>

    <!-- loop -->
    <g transform="translate(700,150)">
      <text x="0" y="0" font-size="12" font-weight="700" letter-spacing="2" fill="#94A3B8">THE LOOP</text>

      <rect x="0" y="26" width="150" height="78" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <text x="20" y="56" font-size="11" font-weight="700" fill="#4F46E5">01</text>
      <text x="20" y="82" font-size="18" font-weight="700" fill="#0F172A">Specify</text>

      <rect x="196" y="26" width="150" height="78" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <text x="216" y="56" font-size="11" font-weight="700" fill="#4F46E5">02</text>
      <text x="216" y="82" font-size="18" font-weight="700" fill="#0F172A">Execute</text>

      <rect x="392" y="26" width="150" height="78" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
      <text x="412" y="56" font-size="11" font-weight="700" fill="#059669">03</text>
      <text x="412" y="82" font-size="18" font-weight="700" fill="#0F172A">Verify</text>

      <line x1="154" y1="65" x2="190" y2="65" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
      <line x1="350" y1="65" x2="386" y2="65" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

      <path d="M 467 104 L 467 160 L 271 160 L 271 110" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar2)"/>
      <rect x="255" y="147" width="230" height="26" rx="13" fill="#FFFFFF" stroke="#C7D2FE"/>
      <text x="370" y="164" font-size="12" font-weight="600" text-anchor="middle" fill="#4338CA">evidence → retry → evidence</text>

      <text x="0" y="220" font-size="15" fill="#475569">The loop is cheap.</text>
      <text x="0" y="244" font-size="15" fill="#475569">Specifying the wrong thing is not.</text>
    </g>
  </g>
</svg>
