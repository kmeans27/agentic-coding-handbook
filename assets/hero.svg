<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Engineering: the four-stage loop</title>
  <desc id="desc">Specify, Execute, Verify, Commit, with a feedback arrow from Verify back to Execute.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="430" rx="18" fill="url(#wash)" stroke="#E2E8F0" stroke-width="1.5"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="86" font-size="12" font-weight="700" letter-spacing="2.4" fill="#4F46E5">OPEN HANDBOOK · FIRST EDITION</text>
    <text x="56" y="146" font-size="42" font-weight="800" fill="#0F172A">Agentic</text>
    <text x="56" y="192" font-size="42" font-weight="800" fill="#0F172A">Engineering</text>
    <text x="56" y="238" font-size="16" fill="#475569">Direct coding agents without</text>
    <text x="56" y="261" font-size="16" fill="#475569">losing the ability to understand</text>
    <text x="56" y="284" font-size="16" fill="#475569">your own code.</text>

    <line x1="56" y1="312" x2="150" y2="312" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <text x="56" y="342" font-size="12.5" fill="#64748B">14 principles · 22 sources</text>
    <text x="56" y="362" font-size="12.5" fill="#64748B">A 14-day plan that needs no keyboard</text>

    <!-- stage labels -->
    <text x="500" y="120" font-size="11" font-weight="700" letter-spacing="1.6" fill="#94A3B8">THE LOOP</text>

    <!-- nodes -->
    <g>
      <rect x="500" y="148" width="132" height="70" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <circle cx="524" cy="172" r="9" fill="#EEF2FF"/>
      <text x="524" y="176" dominant-baseline="central" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4F46E5">01</text>
      <text x="566" y="196" font-size="16" font-weight="700" fill="#0F172A">Specify</text>
    </g>

    <g>
      <rect x="676" y="148" width="132" height="70" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <circle cx="700" cy="172" r="9" fill="#EEF2FF"/>
      <text x="700" y="176" dominant-baseline="central" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4F46E5">02</text>
      <text x="742" y="196" font-size="16" font-weight="700" fill="#0F172A">Execute</text>
    </g>

    <g>
      <rect x="852" y="148" width="132" height="70" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
      <circle cx="876" cy="172" r="9" fill="#ECFDF5"/>
      <text x="876" y="176" dominant-baseline="central" font-size="9.5" font-weight="700" text-anchor="middle" fill="#059669">03</text>
      <text x="918" y="196" font-size="16" font-weight="700" fill="#0F172A">Verify</text>
    </g>

    <g>
      <rect x="1028" y="148" width="132" height="70" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <circle cx="1052" cy="172" r="9" fill="#EEF2FF"/>
      <text x="1052" y="176" dominant-baseline="central" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4F46E5">04</text>
      <text x="1094" y="196" font-size="16" font-weight="700" fill="#0F172A">Commit</text>
    </g>

    <!-- forward arrows -->
    <line x1="634" y1="183" x2="670" y2="183" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="810" y1="183" x2="846" y2="183" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="986" y1="183" x2="1022" y2="183" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- feedback loop -->
    <path d="M 918 218 L 918 268 Q 918 284 902 284 L 758 284 Q 742 284 742 268 L 742 222"
          fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAccent)"/>
    <rect x="764" y="270" width="152" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="840" y="287" font-size="11.5" font-weight="600" text-anchor="middle" fill="#4338CA">failure → new information</text>

    <text x="500" y="336" font-size="12.5" fill="#64748B">The loop is cheap. The expensive mistake is specifying the wrong thing.</text>
    <text x="500" y="356" font-size="12.5" fill="#64748B">Optimise for short loops, strong signals, small diffs.</text>
  </g>
</svg>
